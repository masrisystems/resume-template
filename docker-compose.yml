version: "3.8"

services:
  career-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-hub:latest
    container_name: career-hub
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "coolify.managed=true"
